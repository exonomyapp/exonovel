[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/frontend",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
leptos = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7" }
leptos_axum = { version = "0.7" }
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
comrak = "0.35"
ammonia = "4"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
aes-gcm = "0.10"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = "0.6"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "History",
  "Storage",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "DomTokenList",
  "Event",
  "EventTarget",
  "SubmitEvent",
  "PointerEvent",
  "RequestCredentials",
  "UrlSearchParams",
] }

[[workspace.metadata.leptos]]
name = "exonovel"
output-name = "exonovel"
bin-package = "exonovel-server"
lib-package = "exonovel-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
lib-features = ["hydrate"]
