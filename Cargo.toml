[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/frontend",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8" }
axum = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
comrak = "0.35"
ammonia = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
aes-gcm = "0.10"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std"] }
dotenvy = "0.15"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = "0.6"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "History",
  "Navigator",
  "Storage",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "DomTokenList",
  "Event",
  "EventSource",
  "MessageEvent",
  "EventTarget",
  "SubmitEvent",
  "PointerEvent",
  "File",
  "FileList",
  "FileReader",
  "RequestCredentials",
  "UrlSearchParams",
  "Notification",
  "NotificationPermission",
] }

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "exonovel"
output-name = "exonovel"
bin-package = "exonovel-server"
lib-package = "exonovel-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "assets"
site-addr = "127.0.0.1:3001"
reload-port = 3002
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
