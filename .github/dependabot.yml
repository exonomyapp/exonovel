# Dependabot configuration for ExoNovel installed dependency & security hygiene
# Note: Uninstalled "on-hold" crates (willow25, iroh, loro, etc.) are tracked by ExoNovel's
# deterministic crates.io scanner (ADR 005-003), NOT Dependabot.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
    # Keep Cargo.toml manifests pinned to intentional SemVer ranges; only update Cargo.lock within compatible bounds.
    # This prevents Dependabot from opening breaking pre-1.0 0.x -> 0.y bumps (e.g. comrak 0.35->0.59, gloo-net 0.6->0.7)
    # that Dependabot's ignore filter misclassifies as semver-minor, as well as N.x -> N+1.0 major bumps (sqlx 0.9, ed25519-dalek 3).
    versioning-strategy: "lockfile-only"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(ci)"
    labels:
      - "dependencies"
      - "ci"
