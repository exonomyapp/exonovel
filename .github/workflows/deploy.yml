name: Build, Package, and Deploy ExoNovel (Rust + Leptos)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package ExoNovel (Leptos 0.8)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: exonovel-leptos-08

      - name: Install cargo-leptos
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - name: Run Rust workspace unit tests
        run: cargo test --workspace

      - name: Build finished ExoNovel release binary and WASM site assets
        run: cargo leptos build --release

      - name: Package finished release bundle
        run: |
          rm -rf deploy
          mkdir -p deploy
          BIN_PATH=$(find target/release target/server -maxdepth 4 -type f -name exonovel-server | head -n 1)
          test -n "$BIN_PATH"
          cp "$BIN_PATH" deploy/exonovel-server
          chmod +x deploy/exonovel-server
          cp -r target/site deploy/site
          cp -r docs deploy/docs
          cp AGENTS.md deploy/AGENTS.md

      - name: Upload finished package artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: exonovel-package
          path: deploy
          retention-days: 5

  deploy:
    name: Deploy Finished ExoNovel Package to Tencent
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download finished package artifact
        uses: actions/download-artifact@v4
        with:
          name: exonovel-package
          path: deploy

      - name: Upload finished package to Tencent server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "deploy/*"
          target: "/tmp/exonovel-incoming"
          strip_components: 1
          overwrite: true

      - name: Install package and restart exonovel systemd service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/exonovel
            sudo systemctl stop exonovel || true
            sudo rm -rf /opt/exonovel/site /opt/exonovel/docs
            sudo cp /tmp/exonovel-incoming/exonovel-server /opt/exonovel/exonovel-server
            sudo chmod +x /opt/exonovel/exonovel-server
            sudo cp -r /tmp/exonovel-incoming/site /opt/exonovel/site
            sudo cp -r /tmp/exonovel-incoming/docs /opt/exonovel/docs
            sudo cp /tmp/exonovel-incoming/AGENTS.md /opt/exonovel/AGENTS.md
            sudo rm -rf /tmp/exonovel-incoming

            sudo touch /opt/exonovel/env
            sudo chmod 600 /opt/exonovel/env
            sudo sed -i '/^BREVO_SENDER_EMAIL=.*exonovel\.exosystems\.net/d' /opt/exonovel/env || true
            sudo sed -i '/^BREVO_SENDER_EMAIL=.*note@/d' /opt/exonovel/env || true
            ensure_env_default() {
              local key="$1"
              local val="$2"
              if ! sudo grep -qE "^${key}=" /opt/exonovel/env; then
                printf '%s="%s"\n' "$key" "$val" | sudo tee -a /opt/exonovel/env >/dev/null
              fi
            }
            ensure_env_default "BREVO_SENDER_NOTES_EMAIL" "notes@exosystems.net"
            ensure_env_default "BREVO_SENDER_NOTES_NAME" "Notes from ExoNovel"
            ensure_env_default "BREVO_SENDER_NOREPLY_EMAIL" "noreply@exosystems.net"
            ensure_env_default "BREVO_SENDER_NOREPLY_NAME" "Exosystems"
            ensure_env_default "BREVO_SENDER_SUPPORT_EMAIL" "support@exosystems.net"
            ensure_env_default "BREVO_SENDER_SUPPORT_NAME" "ExoSupport"

            if [ ! -f /opt/exonovel/vapid_private.pem ]; then
              sudo openssl ecparam -name prime256v1 -genkey -noout -out /opt/exonovel/vapid_private.pem
              sudo chmod 600 /opt/exonovel/vapid_private.pem
            fi
            VAPID_PUB=$(sudo openssl ec -in /opt/exonovel/vapid_private.pem -pubout -outform DER 2>/dev/null | tail -c 65 | base64 -w0 | tr '/+' '_-' | tr -d '=')
            ensure_env_default "VAPID_PRIVATE_KEY_PATH" "/opt/exonovel/vapid_private.pem"
            if [ -n "$VAPID_PUB" ]; then
              ensure_env_default "VAPID_PUBLIC_KEY" "$VAPID_PUB"
            fi

            sudo tee /etc/systemd/system/exonovel.service >/dev/null <<'UNIT'
            [Unit]
            Description=ExoNovel Rust + Leptos SSR Server
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/exonovel
            Environment=PORT=3001
            Environment=LEPTOS_SITE_ADDR=127.0.0.1:3001
            Environment=LEPTOS_SITE_ROOT=/opt/exonovel/site
            Environment=LEPTOS_SITE_PKG_DIR=pkg
            Environment=LEPTOS_OUTPUT_NAME=exonovel
            EnvironmentFile=-/opt/exonovel/env
            ExecStart=/opt/exonovel/exonovel-server
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            UNIT

            sudo systemctl daemon-reload
            sudo systemctl enable exonovel
            sudo systemctl restart exonovel

            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:3001/api/health" | grep -q '"runtime":"rust-leptos"'; then
                echo "ExoNovel service healthy on 127.0.0.1:3001."
                exit 0
              fi
              sleep 2
            done

            echo "ExoNovel failed to answer cleanly on 127.0.0.1:3001."
            sudo journalctl -u exonovel -n 40 --no-pager || true
            exit 1
