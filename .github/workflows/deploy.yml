name: Build, Test, and Deploy ExoNovel (Rust + Leptos)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: Build, Test & Deploy ExoNovel
    runs-on: [self-hosted, linux, x64]
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: "exonovel-cargo-leptos"

      - name: Verify Rust & cargo-leptos toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          command -v cargo-leptos >/dev/null 2>&1 || cargo install cargo-leptos --locked

      - name: Run Rust unit & module tests
        run: cargo test --workspace

      - name: Build ExoNovel Leptos release binary & WASM bundle
        run: cargo leptos build --release

      - name: Stage release bundle
        run: |
          rm -rf dist-exonovel
          mkdir -p dist-exonovel
          BIN_PATH=$(find target/release target/server -maxdepth 4 -type f -name exonovel-server | head -n 1)
          test -n "$BIN_PATH"
          cp "$BIN_PATH" dist-exonovel/exonovel-server
          cp -r target/site dist-exonovel/site
          cp -r docs dist-exonovel/docs
          cp AGENTS.md dist-exonovel/AGENTS.md

      - name: Deploy and restart ExoNovel service
        run: |
          DEPLOY_DIR="${EXONOVEL_DEPLOY_DIR:-/opt/exonovel}"
          SERVICE_NAME="${EXONOVEL_SERVICE_NAME:-exonovel.service}"
          sudo mkdir -p "$DEPLOY_DIR"
          sudo rsync -a --delete --exclude='.env*' dist-exonovel/ "$DEPLOY_DIR/"
          sudo chmod +x "$DEPLOY_DIR/exonovel-server"
          sudo systemctl restart "$SERVICE_NAME"

      - name: Verify live ExoNovel deployment
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://exonovel.exosystems.net/api/health" | grep -q '"runtime":"rust-leptos"'; then
              echo "ExoNovel Rust + Leptos is live and healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed for https://exonovel.exosystems.net/api/health"
          exit 1
